<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tapabú — tiny games for little hands</title>
  <meta name="description" content="Tapabú: small, gentle browser games for toddlers and preschoolers, made by Manu Cruz." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;800&family=Nunito:wght@400;700;800&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="blobs" aria-hidden="true">
      <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
      <span class="blob b4"></span><span class="blob b5"></span>
    </div>
    <h1 class="brand" aria-label="Tapabú">
      <span>T</span><span>a</span><span>p</span><span>a</span><span>b</span><span>ú</span>
    </h1>
    <p class="slogan">Tiny games for little hands</p>
    <a class="scroll-cue" href="#games" aria-label="See the games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
    </a>
  </header>

  <main id="games">
    <h2 class="section-title">Games</h2>
    <div class="gallery" id="gallery"></div>
  </main>

  <footer class="footer">
    <p>Made with care by Manu · <a href="../">Back to portfolio</a></p>
  </footer>

  <template id="panel-template">
    <section class="panel" role="region">
      <div class="panel-clip">
        <div class="panel-inner">
          <button class="panel-close" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
          <div class="panel-media">
            <div class="panel-main"></div>
            <div class="panel-thumbs"></div>
          </div>
          <div class="panel-info">
            <span class="age-tag"></span>
            <h3 class="panel-title" tabindex="-1"></h3>
            <p class="panel-tagline"></p>
            <h4 class="goals-title">What it helps grow</h4>
            <ul class="goals"></ul>
          </div>
          <div class="panel-play">
            <a class="play-button" href="#"></a>
          </div>
        </div>
      </div>
    </section>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
